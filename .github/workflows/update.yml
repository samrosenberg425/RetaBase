name: Update database and publish site

# Daily incremental update: fetch new PubMed records + registry sources, rebuild the
# curated layer + site, and deploy the static dashboard to GitHub Pages.
#
# DURABLE STATE. The authoritative corpus lives in the `corpus-store` GitHub Release
# (versioned corpus-<release_id>.tar.gz + manifest-<release_id>.json + a tiny
# last-good.json pointer), NOT in the Actions cache. The cache is acceleration only.
# Every corpus writer follows ONE path:
#
#   restore -> stage (work/) -> mutate -> build -> validate -> promote
#
# Nothing mutates the restored last-good copy: all fetch/enrichment steps write only to
# work/. The pointer advances only after the candidate is validated, uploaded as a new
# versioned asset and checksum-verified (see scripts/corpus_state.py, docs/corpus_state.md).
#
# Two jobs (GitHub's canonical Pages pattern):
#   build  -> restore + fetch + rebuild + validate + PROMOTE + upload the Pages artifact
#             (serialized with the other corpus writers via the 'retarats-corpus' lock).
#   deploy -> deploy the artifact, in its OWN 'pages' concurrency group so overlapping
#             runs never collide at the deploy step.

on:
  schedule:
    - cron: "0 6 * * *"     # daily 06:00 UTC — rebuild + republish from the growing corpus
  workflow_dispatch:         # allow manual runs
    inputs:
      bootstrap:
        description: >-
          MANUAL BOOTSTRAP (first run only): if the corpus-store release is EMPTY, seed it from
          the legacy Actions cache. Ignored when a last-good corpus already exists.
        type: boolean
        default: false
      simulate:
        description: >-
          Failure drill. cache_miss = skip the cache (must restore from the store);
          empty_trials = inject an empty trials table (promotion must be refused, job red,
          last-good + live site untouched); mixed_release = re-stamp one shard with a stale
          release_id (must be rejected, job red).
        type: choice
        options: [none, cache_miss, empty_trials, mixed_release]
        default: none
      refresh_trials:
        description: >-
          Re-fetch and OVERWRITE already-stored trials. Needed once after adding a new stored field
          (e.g. the trial->publication result_pmids links), because the normal run SKIPS NCTs it
          already has and would never backfill them.
        type: boolean
        default: false

permissions:
  contents: write           # corpus-store release: versioned assets + last-good pointer
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Serialized with the other corpus writers so only one job promotes at a time.
    concurrency:
      group: retarats-corpus
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify dependency resolution (drift / conflict guard)
        # `pip check` fails if the resolved environment is internally inconsistent
        # (incompatible transitive versions). The freeze is logged so the exact
        # resolved versions are auditable per run without a full hash-lock file.
        run: |
          pip check
          echo "::group::Resolved dependency versions"
          pip freeze
          echo "::endgroup::"

      - name: Validate config CSVs (fail fast on a malformed rule file)
        run: python3 scripts/validate_config.py

      # ---- restore -> stage --------------------------------------------------------
      # HARD gate: cache copy only if sha256-identical to last-good; otherwise the
      # last-good release asset; otherwise the job fails (no silent hollow bootstrap).
      - name: Restore last-good corpus (verified) into work/
        uses: ./.github/actions/corpus-restore
        with:
          bootstrap: ${{ github.event.inputs.bootstrap || 'false' }}
          simulate: ${{ github.event.inputs.simulate || '' }}

      - name: Allocate release_id
        run: echo "RELEASE_ID=$(python3 scripts/corpus_state.py release-id)" >> "$GITHUB_ENV"

      # ---- mutate (work/ only) -----------------------------------------------------
      # Each step records its outcome in work/source_status.json (per-source freshness
      # policy: config/source_policy.csv). Fetch steps keep "a source hiccup must not block
      # a publish" semantics: the failure is recorded + surfaced in status.json, and the data
      # already in the corpus (last-good) still deploys.
      # WS4: datetype=edat (Entrez/indexing date, not pdat) + a 14-day window, both
      # driven by config/pubmed_discovery.json. Live measurement (docs/retrieval_benchmark_review.md,
      # local-only) across 8 sampled molecules found edat catching genuine on-topic
      # PMIDs that pdat missed entirely at the same window, with zero cases of pdat
      # catching something edat missed; an independent review confirmed 4 of those
      # 5 edat-only PMIDs as true permanent pdat misses (indexing lagged the nominal
      # pub date past the daily window). Existing evidence_id dedup makes the wider
      # window free (already-seen records skipped).
      - name: Incremental PubMed fetch (edat, 14-day window)
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          API_CONTACT_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: |
          rc=0
          python3 retarats_v2.py --config-mode local --mode daily --daily-days 14 --datetype edat \
            --summary-mode rule_based --sinks local \
            --local-db work/retarats_pubmed.sqlite --state-db work/retarats_state.sqlite || rc=$?
          python3 scripts/record_source_run.py --state work/source_status.json --source pubmed_daily --exit-code "$rc"

      # WS4 weekly re-sweep: on Mondays (UTC), also (a) re-run each rule over the
      # current + previous year (datetype=edat) to catch anything the daily window
      # still missed -- existing dedup makes already-known records free -- and
      # (b) refresh known PMIDs that PubMed now flags as retracted/erratum'd.
      # Gated inside the SAME writer job (not a separate workflow) so it shares this
      # job's single restore/build/promote, rather than needing its own corpus lock.
      - name: "WS4: weekly PubMed re-sweep (current + previous year, edat) + retraction/erratum refresh"
        if: ${{ github.event_name == 'schedule' }}
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          API_CONTACT_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            resweep_rc=0
            RESWEEP_START_YEAR=$(( $(date -u +%Y) - 1 ))
            python3 retarats_v2.py --config-mode local --mode backfill --datetype edat \
              --start-year "$RESWEEP_START_YEAR" \
              --summary-mode rule_based --sinks local \
              --local-db work/retarats_pubmed.sqlite --state-db work/retarats_state.sqlite || resweep_rc=$?

            retraction_rc=0
            python3 scripts/run_retraction_refresh.py --db work/retarats_pubmed.sqlite \
              --molecules config/MOLECULES.csv --retrieval-out work/retraction_refresh.json || retraction_rc=$?

            rc=0
            err=""
            if [ "$resweep_rc" != "0" ]; then rc=1; err="resweep exited $resweep_rc"; fi
            if [ "$retraction_rc" != "0" ]; then rc=1; err="${err:+$err; }retraction refresh exited $retraction_rc"; fi
            RETRIEVAL_JSON=$(cat work/retraction_refresh.json 2>/dev/null || echo '{}')
            python3 scripts/record_source_run.py --state work/source_status.json --source pubmed_resweep_retractions \
              --exit-code "$rc" --error "$err" --retrieval-json "$RETRIEVAL_JSON"
          else
            echo "Not Monday UTC; skipping the weekly re-sweep this run."
          fi

      # WS4: --rolling-refresh re-queries OpenAlex (only) for the oldest-dated
      # already-filled values every day, so citation counts keep climbing instead
      # of freezing at their first value. Semantic Scholar stays fill-only (never
      # rolling-refreshed) -- it is only tried when OpenAlex has nothing.
      - name: Backfill citation counts (OpenAlex, impact axis)
        env:
          API_CONTACT_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: |
          rc=0
          python3 scripts/run_impact_backfill.py --db work/retarats_pubmed.sqlite --newest-first --max-records 8000 \
            --rolling-refresh 2000 || rc=$?
          python3 scripts/record_source_run.py --state work/source_status.json --source openalex --exit-code "$rc"

      - name: Enrich with NIH iCite metrics
        run: |
          rc=0
          python3 scripts/run_icite_backfill.py --db work/retarats_pubmed.sqlite --newest-first --max-records 20000 || rc=$?
          python3 scripts/record_source_run.py --state work/source_status.json --source icite --exit-code "$rc"

      # WS4: iCite policy is "full corpus approximately weekly" (daily above only
      # tops up genuinely missing papers). On Mondays, also refresh every paper
      # whose iCite data is 6+ days old, oldest-first, uncapped (--all) so the
      # whole corpus rotates through in one run.
      - name: "WS4: weekly full-corpus iCite refresh"
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            rc=0
            python3 scripts/run_icite_backfill.py --db work/retarats_pubmed.sqlite --all --refresh-older-than-days 6 || rc=$?
            python3 scripts/record_source_run.py --state work/source_status.json --source icite --exit-code "$rc"
          else
            echo "Not Monday UTC; skipping the weekly full-corpus iCite refresh this run."
          fi

      - name: Fetch ClinicalTrials.gov registry trials
        env:
          API_CONTACT_EMAIL: ${{ secrets.NCBI_EMAIL }}
          REFRESH: ${{ github.event.inputs.refresh_trials == 'true' && '--refresh' || '' }}
        run: |
          rc=0
          python3 scripts/run_trials_fetch.py --db work/retarats_trials.sqlite --retrieval-out work/ctgov_retrieval.json $REFRESH || rc=$?
          RETRIEVAL_JSON=$(cat work/ctgov_retrieval.json 2>/dev/null || echo '{}')
          OUTCOME=$(echo "$RETRIEVAL_JSON" | jq -r '.outcome // ""')
          ARGS=()
          [ -n "$OUTCOME" ] && ARGS+=(--outcome "$OUTCOME")
          python3 scripts/record_source_run.py --state work/source_status.json --source ctgov --exit-code "$rc" "${ARGS[@]}" --retrieval-json "$RETRIEVAL_JSON"

      - name: Fetch EuropePMC preprints
        env:
          API_CONTACT_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: |
          rc=0
          python3 scripts/run_preprints_fetch.py --db work/retarats_preprints.sqlite --retrieval-out work/europepmc_preprints_retrieval.json || rc=$?
          RETRIEVAL_JSON=$(cat work/europepmc_preprints_retrieval.json 2>/dev/null || echo '{}')
          OUTCOME=$(echo "$RETRIEVAL_JSON" | jq -r '.outcome // ""')
          ARGS=()
          [ -n "$OUTCOME" ] && ARGS+=(--outcome "$OUTCOME")
          python3 scripts/record_source_run.py --state work/source_status.json --source europepmc_preprints --exit-code "$rc" "${ARGS[@]}" --retrieval-json "$RETRIEVAL_JSON"

      - name: "SIMULATION empty_trials — inject an empty trials table (promotion must be refused)"
        if: ${{ github.event.inputs.simulate == 'empty_trials' }}
        run: python3 scripts/corpus_state.py simulate --kind empty_trials --work work

      # ---- build -> validate -------------------------------------------------------
      - name: Build curated layer + site + status.json, validate release
        # DEPLOYMENT GATE (no `|| true`): a failing curated validation, missing/empty asset
        # or mixed release_id fails the job, so nothing is promoted or deployed and the last
        # good site stays up. Baseline for the anomaly gates = the durable last-good manifest.
        run: python3 scripts/build_release.py --work work --out exports --release-id "$RELEASE_ID"

      - name: "SIMULATION mixed_release — re-stamp one shard with a stale release_id (must be rejected)"
        if: ${{ github.event.inputs.simulate == 'mixed_release' }}
        run: python3 scripts/corpus_state.py simulate --kind mixed_release --work work --site-dir exports/site

      - name: Corpus freshness alert (soft)
        # SOFT alert (`|| true`): records the corpus size and, if it hasn't grown in >= 14
        # days, emits a ::warning:: + job-summary line. Runs BEFORE promote so the updated
        # state file is archived with this release.
        run: |
          python3 scripts/check_corpus_freshness.py --mode freshness \
            --db work/retarats_pubmed.sqlite --state work/freshness_state.json \
            --stats exports/curated/corpus_stats.json --max-stale-days 14 || true

      # ---- promote (the only place last-good can advance) ----------------------------
      - name: Promote (validate -> upload new versioned asset -> verify sha256 -> advance last-good)
        uses: ./.github/actions/corpus-promote
        with:
          release-id: ${{ env.RELEASE_ID }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: exports/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Dedicated Pages-deploy lock. cancel-in-progress: a newer deploy supersedes
    # an older in-flight one instead of both failing with "try again later"
    # (which happens when runs stack up and compete for the single Pages env).
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

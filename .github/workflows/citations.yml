name: Backfill citations (manual)

# The daily update.yml now tops up OpenAlex citations + NIH iCite itself (single corpus
# writer). This workflow is kept as a MANUAL-ONLY bigger catch-up run (raise max_records,
# e.g. 25000); its daily schedule was removed so it no longer competes with the daily writer.
#
# Same single path as every writer: restore -> stage (work/) -> mutate -> build ->
# validate -> promote. It does NOT deploy Pages; the next update.yml run publishes.

on:
  workflow_dispatch:
    inputs:
      max_records:
        description: "How many missing-citation papers to fill this run (OpenAlex). Raise (e.g. 25000) for a big manual catch-up."
        default: "6000"

permissions:
  contents: write           # corpus-store release: versioned assets + last-good pointer

concurrency:
  # Shared with the other corpus writers: only ONE job may promote at a time.
  group: retarats-corpus
  cancel-in-progress: false

jobs:
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Restore last-good corpus (verified) into work/
        uses: ./.github/actions/corpus-restore

      - name: Allocate release_id
        run: echo "RELEASE_ID=$(python3 scripts/corpus_state.py release-id)" >> "$GITHUB_ENV"

      - name: Backfill a batch of citations (newest first, work/ only)
        env:
          API_CONTACT_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: |
          rc=0
          python3 scripts/run_impact_backfill.py --db work/retarats_pubmed.sqlite \
            --newest-first --max-records ${{ github.event.inputs.max_records || '6000' }} || rc=$?
          python3 scripts/record_source_run.py --state work/source_status.json --source openalex --exit-code "$rc"

      - name: Build curated layer + site + status.json, validate release
        run: python3 scripts/build_release.py --work work --out exports --release-id "$RELEASE_ID"

      - name: Promote (validate -> upload new versioned asset -> verify sha256 -> advance last-good)
        uses: ./.github/actions/corpus-promote
        with:
          release-id: ${{ env.RELEASE_ID }}

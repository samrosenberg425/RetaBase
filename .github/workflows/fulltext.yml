name: Full-text backfill (open access)

# Fetches open-access Methods/Results (PMC BioC, Europe PMC fallback) onto corpus
# papers so the RULES extractor can find doses/durations/sample sizes that abstracts
# never state. An audit found ~96% of missing doses are absent from the abstract, so
# this is the single highest-value enrichment for extraction quality.
#
# Resumable: each paper is attempted once and non-OA papers are recorded so they are
# never retried. Follows the single corpus-writer path (restore -> stage -> mutate ->
# build -> validate -> promote) and is serialized with the other writers via the shared
# lock. It does NOT deploy Pages; the next update.yml run publishes the result.

on:
  schedule:
    - cron: "0 4 * * 2,6"   # Tue + Sat 04:00 UTC, off-peak vs the other jobs
  workflow_dispatch:
    inputs:
      max_records:
        description: "Papers to enrich this run"
        type: string
        default: "8000"

permissions:
  contents: write           # corpus-store release: versioned assets + last-good pointer

concurrency:
  group: retarats-corpus
  cancel-in-progress: false

jobs:
  fulltext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore last-good corpus (verified) into work/
        uses: ./.github/actions/corpus-restore

      - name: Allocate release_id
        run: echo "RELEASE_ID=$(python3 scripts/corpus_state.py release-id)" >> "$GITHUB_ENV"

      # Cache the fetched full text separately so re-runs never re-download
      # (HTTP-response cache: acceleration only, holds no corpus state).
      - name: Restore full-text cache
        uses: actions/cache@v4
        with:
          path: .cache/context
          key: retarats-fulltext-${{ github.run_id }}
          restore-keys: |
            retarats-fulltext-

      - name: Backfill open-access full text (work/ only)
        env:
          API_CONTACT_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: |
          rc=0
          python3 scripts/run_fulltext_backfill.py \
            --db work/retarats_pubmed.sqlite \
            --max-records ${{ github.event.inputs.max_records || 8000 }} || rc=$?
          python3 scripts/record_source_run.py --state work/source_status.json --source fulltext --exit-code "$rc"

      - name: Report extraction coverage after backfill
        run: |
          python3 scripts/audit_missing_fields.py --db work/retarats_pubmed.sqlite --sample 4000 || true

      - name: Build curated layer + site + status.json, validate release
        run: python3 scripts/build_release.py --work work --out exports --release-id "$RELEASE_ID"

      - name: Promote (validate -> upload new versioned asset -> verify sha256 -> advance last-good)
        uses: ./.github/actions/corpus-promote
        with:
          release-id: ${{ env.RELEASE_ID }}

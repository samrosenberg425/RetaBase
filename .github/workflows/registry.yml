name: Registry sources (trials + preprints) — manual

# The daily update.yml now fetches registry trials + EuropePMC preprints itself (single
# corpus writer). This workflow is kept as a MANUAL-ONLY run for an on-demand registry
# refresh; its schedule was removed so it no longer competes with the daily writer.
#
# Same single path as every writer: restore -> stage (work/) -> mutate -> build ->
# validate -> promote. It does NOT deploy Pages; the next update.yml run publishes.

on:
  workflow_dispatch:
    inputs:
      refresh_trials:
        description: >-
          Re-fetch and OVERWRITE already-stored trials. Needed once after adding a
          new stored field (e.g. the trial->publication result_pmids links), because
          the normal run SKIPS NCTs it already has and would never backfill them.
        type: boolean
        default: false

permissions:
  contents: write           # corpus-store release: versioned assets + last-good pointer

concurrency:
  # Serialized with update/backfill/fulltext: only one job promotes at a time.
  group: retarats-corpus
  cancel-in-progress: false

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore last-good corpus (verified) into work/
        uses: ./.github/actions/corpus-restore

      - name: Allocate release_id
        run: echo "RELEASE_ID=$(python3 scripts/corpus_state.py release-id)" >> "$GITHUB_ENV"

      - name: Fetch ClinicalTrials.gov registry trials (work/ only)
        env:
          API_CONTACT_EMAIL: ${{ secrets.NCBI_EMAIL }}
          # Only set on a manual run with refresh_trials=true.
          REFRESH: ${{ github.event.inputs.refresh_trials == 'true' && '--refresh' || '' }}
        run: |
          rc=0
          python3 scripts/run_trials_fetch.py --db work/retarats_trials.sqlite $REFRESH || rc=$?
          python3 scripts/record_source_run.py --state work/source_status.json --source ctgov --exit-code "$rc"

      - name: Fetch EuropePMC preprints (work/ only)
        env:
          API_CONTACT_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: |
          rc=0
          python3 scripts/run_preprints_fetch.py --db work/retarats_preprints.sqlite || rc=$?
          python3 scripts/record_source_run.py --state work/source_status.json --source europepmc_preprints --exit-code "$rc"

      - name: Build curated layer + site + status.json, validate release
        run: python3 scripts/build_release.py --work work --out exports --release-id "$RELEASE_ID"

      - name: Promote (validate -> upload new versioned asset -> verify sha256 -> advance last-good)
        uses: ./.github/actions/corpus-promote
        with:
          release-id: ${{ env.RELEASE_ID }}

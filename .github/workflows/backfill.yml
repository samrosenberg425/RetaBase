name: Historical backfill (manual)

# Manual-only historical backfill (the 6-hourly schedule was retired: every year is marked
# done in the checkpoint, and an unattended writer that races the daily update is exactly
# what the single-writer design removes). Walks backwards from a start year, size-capped,
# resumable via backfill_checkpoint.json, which now lives INSIDE the durable corpus state
# (work/ -> promoted archive) instead of the Actions cache.
#
# Same single path as every writer: restore -> stage (work/) -> mutate -> build -> validate
# -> promote. This job does NOT deploy Pages; the next update.yml run publishes the result.

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Newest year to fetch (walk backwards from here)"
        default: "2025"
      min_year:
        description: "Oldest year to attempt (2000 = the priority target; lower it later for pre-2000)"
        default: "2000"
      target_gb:
        description: "Stop once the SQLite reaches this size (GB)"
        default: "8"
      max_years:
        description: "How many years to fetch in THIS run (bounds it under the 6h job limit)"
        default: "3"
      force:
        description: "Re-fetch years even if the checkpoint marks them done (use after changing search terms). Set to true for a corrective re-run."
        type: boolean
        default: false

permissions:
  contents: write           # corpus-store release: versioned assets + last-good pointer

concurrency:
  # Serialized with update + fulltext so only one job promotes at a time.
  group: retarats-corpus
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Validate config CSVs (fail fast on a malformed rule file)
        run: python3 scripts/validate_config.py

      - name: Restore last-good corpus (verified) into work/
        uses: ./.github/actions/corpus-restore

      - name: Allocate release_id
        run: echo "RELEASE_ID=$(python3 scripts/corpus_state.py release-id)" >> "$GITHUB_ENV"

      - name: Run backfill (work/ only)
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          API_CONTACT_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: |
          python3 scripts/run_backfill.py \
            --start-year ${{ github.event.inputs.start_year || '2025' }} \
            --min-year ${{ github.event.inputs.min_year || '2000' }} \
            --target-gb ${{ github.event.inputs.target_gb || '8' }} \
            --max-years ${{ github.event.inputs.max_years || '3' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }} \
            --db work/retarats_pubmed.sqlite --state-db work/retarats_state.sqlite \
            --checkpoint work/backfill_checkpoint.json

      - name: Build curated layer + site + status.json, validate release
        run: python3 scripts/build_release.py --work work --out exports --release-id "$RELEASE_ID"

      - name: Promote (validate -> upload new versioned asset -> verify sha256 -> advance last-good)
        uses: ./.github/actions/corpus-promote
        with:
          release-id: ${{ env.RELEASE_ID }}

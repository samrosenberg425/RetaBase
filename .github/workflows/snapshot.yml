name: Corpus snapshot (durable backup)

# The authoritative corpus lives in the `corpus-store` release (last-good pointer +
# versioned assets); the Actions cache is only an accelerator. This job takes a periodic
# COMPRESSED weekly snapshot of the SQLite corpus + a checksum + the stats, and publishes
# them as a separate GitHub Release asset (history, retained independently of corpus-store
# pruning). It only READS the last-good corpus (restore-only, verified), so it never
# disturbs the live corpus.

on:
  schedule:
    - cron: "0 5 * * 0"    # weekly, Sunday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write          # required to create the release + upload assets

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore last-good corpus (verified, read-only)
        uses: ./.github/actions/corpus-restore

      - name: Package snapshot
        id: pack
        run: |
          if [ ! -f work/retarats_pubmed.sqlite ]; then
            echo "No corpus in the cache yet; nothing to snapshot."
            exit 0
          fi
          d=$(date -u +%Y%m%d)
          mkdir -p snap
          # Compact the DB (reclaims deleted space) before compressing. Safe: this
          # runner copy is never promoted or written back anywhere.
          python3 -c "import sqlite3; c=sqlite3.connect('work/retarats_pubmed.sqlite'); c.execute('VACUUM'); c.close()"
          tar -I 'gzip -9' -cf "snap/retarats_corpus_${d}.tar.gz" -C work retarats_pubmed.sqlite
          sha256sum "snap/retarats_corpus_${d}.tar.gz" > "snap/retarats_corpus_${d}.sha256"
          [ -f work/.baseline_stats.json ] && cp work/.baseline_stats.json "snap/corpus_stats_${d}.json" || true
          ls -lh snap
          echo "date=${d}" >> "$GITHUB_OUTPUT"

      - name: Publish snapshot release
        if: ${{ hashFiles('snap/*.tar.gz') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: snapshot-${{ steps.pack.outputs.date }}
        run: |
          gh release create "$TAG" snap/* --repo "$REPO" \
            --title "Corpus snapshot ${{ steps.pack.outputs.date }}" \
            --notes "Durable weekly snapshot of the SQLite corpus + sha256 checksum + stats. Restore: download, verify with the .sha256, gunzip/untar into data/." \
          || gh release upload "$TAG" snap/* --repo "$REPO" --clobber
